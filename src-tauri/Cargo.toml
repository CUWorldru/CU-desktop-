[package]
name = "cu-desktop"
version = "0.1.0"
description = "CU Desktop for Windows"
authors = ["SeeYouMore"]
edition = "2021"

[lib]
name = "cu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
