name: CU Desktop — Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-check:
    name: Frontend and Rust checks (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build frontend
        run: npm run build

      - name: Compile Tauri Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit generated lockfiles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: pin desktop dependency lockfiles"
          file_pattern: package-lock.json src-tauri/Cargo.lock
