name: CU Desktop — Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    name: Frontend and Rust checks (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build frontend
        run: npm run build

      - name: Compile Tauri Rust shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Export generated lockfiles for pinning
        uses: actions/upload-artifact@v4
        with:
          name: cu-desktop-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
